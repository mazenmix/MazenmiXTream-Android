<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0e">
<meta name="description" content="MazenmiXTream MX TV premium browser IPTV player.">
<meta name="referrer" content="no-referrer">
<title>MX TV · MazenmiXTream</title>
<link rel="stylesheet" href="/web.css">
</head>
<body>
<div class="shell">
 <header class="topbar">
  <button class="brand" id="homeButton">
   <span class="brand-mark">MX</span>
   <span class="brand-sep" aria-hidden="true"></span>
   <span><span class="brand-name">Mazenmi<em>XTream</em></span><span class="brand-sub">MX TV · Premium Entertainment</span></span>
  </button>
  <div class="top-actions">
   <span class="status" id="connectionStatus"><i></i>Not connected</span>
   <button class="top-action" data-route="manage"><span id="accountName">No playlist</span> ⚙</button>
  </div>
 </header>
 <main id="main"></main>
 <footer class="footer">MAZENMIX · MX TV WEB EDITION</footer>
</div>
<div id="dialog" class="dialog hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="hidden" role="status" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d1d24;border:1px solid #e6bd7277;border-radius:12px;padding:13px 20px;z-index:100;color:#fff"></div>
<div class="player hidden" id="player" role="dialog" aria-label="Media player">
 <video id="video" autoplay playsinline controls></video>
 <div class="player-bar">
  <div><strong id="playerName"></strong><small id="playerDetails"></small><span id="playerError" style="color:#ff9f9f;font-size:11px;display:block;margin-top:7px"></span></div>
  <div class="row-actions"><button class="secondary" id="favoritePlayer">♡ Favorite</button> <button class="primary" id="closePlayer">✕ Close player</button></div>
 </div>
</div>
<script src="/vendor/hls.min.js"></script>
<script src="/vendor/mpegts.js"></script>
<script src="/web.js"></script>
</body>
</html>
