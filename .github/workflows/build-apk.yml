name: Build MazenmiXTream APK

on:
  push:
    branches: [main]
    paths:
      - main.js
      - native/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/build-apk.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install project dependencies
        run: npm ci
      - name: Build, sign and test the APK
        run: npm run build
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MazenmiXTream-v1.1.7-Stalker-50plus
          path: dist/app.apk
          if-no-files-found: error
          retention-days: 30
