name: Build MazenmiXTream APK

on:
  push:
    branches: [main]
    paths:
      - main.js
      - app.js
      - native/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/build-apk.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install project dependencies
        run: npm ci
      - name: Build, sign and test the APK
        run: npm run build
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MazenmiXTream-v1.1.7-Stalker-50plus
          path: dist/app.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish version 1.1.7 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.7 >/dev/null 2>&1; then
            gh release upload v1.1.7 "dist/app.apk#MazenmiXTream-v1.1.7-Stalker.apk" --clobber
          else
            gh release create v1.1.7 "dist/app.apk#MazenmiXTream-v1.1.7-Stalker.apk" --title "MazenmiXTream v1.1.7 — Stalker/MAG + 50+ playlists" --notes "Adds authorized MAG/Stalker Portal URL + MAC authentication, channels and create_link playback. Supports at least 50 sources without a storage-count restriction. Retains Xtream and M3U support. Install only after backing up existing playlist settings."
          fi
