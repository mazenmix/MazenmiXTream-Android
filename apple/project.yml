name: MazenmiXTream
options:
  bundleIdPrefix: com.mazenmix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MazenmiXTreamCore:
    path: .
targets:
  MazenmiXTream:
    type: application
    platform: iOS
    sources:
      - path: MazenmiXTreamApp
    dependencies:
      - package: MazenmiXTreamCore
        product: MazenmiXTreamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazenmix.xtream.ios
        PRODUCT_NAME: MazenmiXTream
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: MazenmiXTreamApp/Info.plist
      properties:
        CFBundleDisplayName: MazenmiXTream
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to IPTV servers and playlists on your local network.
  MazenmiXTreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MazenmiXTreamCore/Tests/MazenmiXTreamCoreTests
    dependencies:
      - target: MazenmiXTream
      - package: MazenmiXTreamCore
        product: MazenmiXTreamCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MazenmiXTream:
    build:
      targets:
        MazenmiXTream: all
        MazenmiXTreamTests: [test]
    test:
      targets:
        - MazenmiXTreamTests
